<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Формы рл препод</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-group">
        <legend class="form-group-title">Ваши личные данные</legend>
        <label for="name" class="label">Ваше имя</label>
        <input
          type="text"
          name="name"
          id="name"
          class="input"
          placeholder="Имя"
        />
        <label for="age" class="label">Ваш возраст</label>
        <input
          type="number"
          name="age"
          id="age"
          class="input"
          placeholder="Возраст"
        />
        <label for="age" class="label">Ваш номер телефона</label>
        <input
          type="tel"
          name="phone"
          id="phone"
          class="input"
          placeholder="+12345678901"
        />
        <label for="age" class="label">Ваша почта</label>
        <input
          type="email"
          name="email"
          id="email"
          class="input"
          placeholder="ivan.ivanov@mail.ru"
        />
      </fieldset>
      <fieldset class="form-group">
        <label for="message" class="label">Сообщение</label>
        <textarea
          name="message"
          id="message"
          class="nextarea"
          placeholder="Ваше сообщение"
          required
        ></textarea>
        <label class="label checkbox-label">
          <input type="checkbox" name="checkbox" class="checkbox" required />
          <span class="checkbox-text">Я принимаю правила</span>
        </label>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
